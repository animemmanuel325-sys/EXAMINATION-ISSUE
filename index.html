<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nursing Examination Issues Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#0b6b5c;--bd:#d8dee6;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:12px 16px}header h1{font-size:17px;margin:0 0 8px}
nav button{background:#ffffff26;color:#fff;border:0;padding:8px 12px;border-radius:6px;margin:0 4px 4px 0;font-size:14px}
nav button.on{background:#fff;color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:#fff}
button.p{background:var(--pri);color:#fff;border:0;padding:11px 16px;border-radius:6px;font:inherit;margin-top:12px}
button.s{background:#fff;border:1px solid var(--bd);padding:6px 10px;border-radius:6px;font-size:13px}
.hint{color:var(--mut);font-size:13px}.msg{padding:10px;border-radius:6px;margin-top:10px}.ok{background:#e6f4ea}.err{background:#fde8e8;color:var(--bad)}
.hide{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef2f6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#eef6f4;border-radius:8px;padding:10px}.stat b{font-size:22px;display:block}
.tabs button{margin:0 4px 8px 0}.tabs button.on{background:var(--pri);color:#fff}
.flag{color:var(--bad);font-weight:700}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>
<header><h1 id="title">Nursing Examination Issues Portal</h1>
<nav><button data-v="student" class="on">Students</button><button data-v="admin">Admin</button></nav></header>
<main>
<section id="student">
<div id="auth" class="card">
<div class="tabs"><button class="s on" id="tLogin">Log in</button><button class="s" id="tReg">Create account</button></div>
<form id="loginF"><label>Student ID</label><input name="sid" required maxlength="30" autocomplete="username">
<label>Password</label><input name="pw" type="password" required autocomplete="current-password"><button class="p">Log in</button></form>
<form id="regF" class="hide"><label>Full name</label><input name="full_name" required minlength="3" maxlength="150">
<label>Student ID (index number)</label><input name="sid" required maxlength="30" autocomplete="username">
<p class="hint">Enter your own ID carefully. It can't be changed, and one ID can have only one account.</p>
<div class="row"><div><label>Admission year</label><select name="admission_year" required></select></div>
<div><label>Intake</label><select name="intake" required><option>January</option><option>September</option></select></div></div>
<label>Password (at least 8 characters)</label><input name="pw" type="password" minlength="8" required autocomplete="new-password">
<label>Confirm password</label><input name="pw2" type="password" minlength="8" required autocomplete="new-password">
<button class="p">Create account</button></form><div id="aMsg"></div></div>
<div id="me" class="hide">
<div class="card"><button class="s" id="sOut" style="float:right">Log out</button><b id="meName"></b><br><span class="hint" id="meInfo"></span></div>
<div class="card"><h4>New report</h4><p id="instr" class="hint"></p>
<form id="f">
<label>Your current level</label><select name="current_level" required><option>Level 100</option><option>Level 200</option><option>Level 300</option><option>Level 400</option></select>
<p class="hint">Now describe the exam problem. Use the level and semester when the problem happened.</p>
<div class="row"><div><label>Affected level</label><select name="affected_level" required><option>Level 100</option><option>Level 200</option><option>Level 300</option><option>Level 400</option></select></div>
<div><label>Affected semester</label><select name="affected_semester" required><option>First Semester</option><option>Second Semester</option></select></div></div>
<label>Course</label><select name="course_id" id="course" required></select>
<label>Type of issue</label><select name="category_id" id="cat" required></select>
<div id="otherBox" class="hide"><label>Please explain the issue</label><input name="other_explanation" maxlength="300"></div>
<label>Description</label><textarea name="description" rows="4" required minlength="10" maxlength="3000"></textarea>
<label>Supporting document (optional)</label><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png"><div class="hint" id="upHint"></div>
<button class="p" id="sendBtn">Submit report</button></form><div id="sMsg"></div></div>
<div class="card"><h4>My reports</h4><div class="tw" id="myCases"></div></div>
</div></section>

<section id="admin" class="hide">
<div id="login" class="card"><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
<button class="p" id="loginBtn">Sign in</button><div id="lMsg"></div></div>
<div id="dash" class="hide">
<div class="tabs noprint"><button data-t="ov" class="s on">Overview</button><button data-t="cases" class="s">Cases</button><button data-t="setup" class="s">Courses &amp; Categories</button><button data-t="rep" class="s">Reports</button><button id="out" class="s">Sign out</button></div>
<div id="ov" class="card"></div>
<div id="cases" class="card hide"><div class="noprint"><div class="row"><input id="q" placeholder="Search name, index or reference"><select id="fBatch"></select></div>
<div class="row" style="margin-top:8px"><select id="fCourse"></select><select id="fCat"></select></div>
<div class="row" style="margin-top:8px"><select id="fLevel"></select><select id="fSem"></select></div>
<div style="margin-top:8px"><select id="fStatus"></select></div></div><p class="hint" id="count"></p><div class="tw" id="caseTbl"></div></div>
<div id="setup" class="card hide"></div>
<div id="rep" class="card hide"><div class="noprint"><label>Group report by</label><select id="mode"><option value="batch">Admission batch → course</option><option value="course">Course across all batches</option><option value="sem">Level &amp; semester → course</option></select>
<p class="hint">Uses the filters set on the Cases tab.</p><button class="p" id="gen">Preview</button> <button class="p" id="prt">Print / Save as PDF</button> <button class="p" id="csv">Export CSV</button></div><div id="repOut"></div></div>
</div></section>
</main>
<script>
/* ====== CONFIGURE THESE TWO LINES ====== */
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL";
const ANON_KEY = "PASTE_YOUR_ANON_KEY";
/* ======================================= */
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
const API = SUPABASE_URL + "/functions/v1/exam-api";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg = (el, t, ok) => $(el).innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${esc(t)}</div>`;
const opts = (arr, first) => (first ? `<option value="">${first}</option>` : "") + arr.map(o => `<option value="${esc(o.v ?? o)}">${esc(o.t ?? o)}</option>`).join("");

// ---- navigation ----
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["student", "admin"].forEach(id => $("#" + id).classList.toggle("hide", id !== b.dataset.v));
});

// ---- student portal ----
const mail = id => "s" + [...new TextEncoder().encode(id.trim().toUpperCase())].map(b => b.toString(16).padStart(2, "0")).join("") + "@students.example.com";
let CATS = [];
async function authHeaders() { const {data: {session}} = await sb.auth.getSession(); return {apikey: ANON_KEY, Authorization: "Bearer " + (session ? session.access_token : ANON_KEY)}; }
$("#tLogin").onclick = () => { $("#loginF").classList.remove("hide"); $("#regF").classList.add("hide"); $("#tLogin").classList.add("on"); $("#tReg").classList.remove("on"); $("#aMsg").innerHTML = ""; };
$("#tReg").onclick = () => { $("#regF").classList.remove("hide"); $("#loginF").classList.add("hide"); $("#tReg").classList.add("on"); $("#tLogin").classList.remove("on"); $("#aMsg").innerHTML = ""; };
async function studentLogin(sid, pw) {
  const {error} = await sb.auth.signInWithPassword({email: mail(sid), password: pw});
  if (error) return msg("#aMsg", "Wrong Student ID or password.", false);
  $("#aMsg").innerHTML = ""; refreshStudent();
}
$("#loginF").onsubmit = e => { e.preventDefault(); const f = e.target; studentLogin(f.sid.value, f.pw.value); };
$("#regF").onsubmit = async e => {
  e.preventDefault(); const f = e.target;
  if (f.pw.value !== f.pw2.value) return msg("#aMsg", "Passwords do not match.", false);
  const fd = new FormData(); fd.append("action", "register"); fd.append("full_name", f.full_name.value); fd.append("sid", f.sid.value);
  fd.append("admission_year", f.admission_year.value); fd.append("intake", f.intake.value); fd.append("password", f.pw.value);
  msg("#aMsg", "Creating account…", true);
  const r = await fetch(API, {method: "POST", headers: {apikey: ANON_KEY}, body: fd}); const j = await r.json();
  if (!r.ok) return msg("#aMsg", j.error || "Could not create account", false);
  studentLogin(f.sid.value, f.pw.value);
};
$("#sOut").onclick = async () => { await sb.auth.signOut(); refreshStudent(); };
async function initStudent() {
  $("[name=admission_year]").innerHTML = opts(Array.from({length: 11}, (_, i) => 2020 + i));
  const [c, k, s] = await Promise.all([
    sb.from("courses").select("id,name").eq("is_active", true).order("name"),
    sb.from("issue_categories").select("id,name,requires_explanation").eq("is_active", true).order("sort_order"),
    sb.from("settings").select("key,value")]);
  $("#course").innerHTML = opts((c.data || []).map(x => ({v: x.id, t: x.name})), "Select course");
  CATS = k.data || [];
  $("#cat").innerHTML = opts(CATS.map(x => ({v: x.id, t: x.name})), "Select issue type");
  const S = Object.fromEntries((s.data || []).map(r => [r.key, r.value]));
  if (S.site_title) { $("#title").textContent = S.site_title; document.title = S.site_title; }
  $("#instr").textContent = S.reporting_instructions || "";
  $("#upHint").textContent = `Max ${S.max_upload_mb || 5} MB. Allowed: PDF, JPG, PNG.`;
  refreshStudent();
}
async function refreshStudent() {
  const {data: {session}} = await sb.auth.getSession(); let me = null;
  if (session) { const r = await sb.from("v_me").select("*").maybeSingle(); me = r.data; }
  $("#auth").classList.toggle("hide", !!me); $("#me").classList.toggle("hide", !me);
  if (me) { $("#meName").textContent = me.full_name; $("#meInfo").textContent = `Student ID ${me.index_number} · ${me.admission_year} ${me.intake} Intake`; loadMine(); }
}
async function loadMine() {
  const {data} = await sb.from("v_my_cases").select("*").order("submitted_at", {ascending: false});
  $("#myCases").innerHTML = (data || []).length ? `<table><tr><th>Ref</th><th>Course</th><th>Level / Sem</th><th>Issue</th><th>Status</th><th>Submitted</th></tr>` +
    data.map(x => `<tr><td>${esc(x.reference_no)}</td><td>${esc(x.course)}</td><td>${esc(x.affected_level)}<br>${esc(x.affected_semester)}</td><td>${esc(x.category)}</td><td><b>${esc(x.status)}</b></td><td>${new Date(x.submitted_at).toLocaleDateString()}</td></tr>`).join("") + "</table>" : '<p class="hint">No reports yet.</p>';
}
$("#cat").onchange = e => $("#otherBox").classList.toggle("hide", !(CATS.find(c => c.id === e.target.value) || {}).requires_explanation);
async function send(confirmDup) {
  const fd = new FormData($("#f")); fd.append("action", "submit"); if (confirmDup) fd.append("confirm_duplicate", "1");
  $("#sendBtn").disabled = true; msg("#sMsg", "Submitting…", true);
  try {
    const r = await fetch(API, {method: "POST", headers: await authHeaders(), body: fd}); const j = await r.json();
    if (!r.ok) return msg("#sMsg", j.error || "Submission failed", false);
    if (j.status === "duplicate_warning") { if (confirm(j.message + "\n\nSubmit anyway as a separate case?")) return send(true); return msg("#sMsg", "Not submitted.", false); }
    $("#f").reset(); $("#otherBox").classList.add("hide"); loadMine();
    msg("#sMsg", `Submitted. Your reference number is ${j.reference_no}.`, true);
  } catch (e) { msg("#sMsg", "Network error. Please try again.", false); } finally { $("#sendBtn").disabled = false; }
}
$("#f").onsubmit = e => { e.preventDefault(); send(false); };

// ---- admin ----
let ALL = [], STAT = [], COURSES = [], CATLIST = [];
$("#loginBtn").onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email: $("#em").value, password: $("#pw").value});
  if (error) return msg("#lMsg", "Login failed", false); startAdmin(false);
};
$("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
async function startAdmin(silent) {
  const {data: me} = await sb.from("admin_users").select("role,is_active").maybeSingle();
  if (!me || !me.is_active) { if (silent) return; await sb.auth.signOut(); refreshStudent(); return msg("#lMsg", "This account is not an authorised admin.", false); }
  $("#login").classList.add("hide"); $("#dash").classList.remove("hide"); await loadAll();
}
async function loadAll() {
  const [c, st, co, ca] = await Promise.all([
    sb.from("v_case_details").select("*").order("submitted_at", {ascending: false}).limit(2000),
    sb.from("case_statuses").select("id,name").order("sort_order"),
    sb.from("courses").select("*").order("name"), sb.from("issue_categories").select("*").order("sort_order")]);
  ALL = c.data || []; STAT = st.data || []; COURSES = co.data || []; CATLIST = ca.data || [];
  fillFilters(); renderOv(); renderCases(); renderSetup();
}
document.querySelectorAll(".tabs [data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs [data-t]").forEach(x => x.classList.toggle("on", x === b));
  ["ov", "cases", "setup", "rep"].forEach(id => $("#" + id).classList.toggle("hide", id !== b.dataset.t));
});
const uniq = (k) => [...new Set(ALL.map(x => x[k]))].sort();
function fillFilters() {
  const set = (id, arr, lbl) => { const cur = $(id).value; $(id).innerHTML = opts(arr, lbl); $(id).value = cur; };
  set("#fBatch", uniq("batch_label"), "All batches"); set("#fCourse", uniq("course"), "All courses"); set("#fCat", uniq("category"), "All issue types");
  set("#fLevel", ["Level 100", "Level 200", "Level 300", "Level 400"], "All levels"); set("#fSem", ["First Semester", "Second Semester"], "All semesters");
  set("#fStatus", STAT.map(s => s.name), "All statuses");
}
["#q", "#fBatch", "#fCourse", "#fCat", "#fLevel", "#fSem", "#fStatus"].forEach(id => $(id).oninput = renderCases);
function filtered() {
  const q = $("#q").value.trim().toLowerCase();
  return ALL.filter(x => (!q || [x.full_name, x.index_number, x.reference_no].some(v => (v || "").toLowerCase().includes(q))) &&
    (!$("#fBatch").value || x.batch_label === $("#fBatch").value) && (!$("#fCourse").value || x.course === $("#fCourse").value) &&
    (!$("#fCat").value || x.category === $("#fCat").value) && (!$("#fLevel").value || x.affected_level === $("#fLevel").value) &&
    (!$("#fSem").value || x.affected_semester === $("#fSem").value) && (!$("#fStatus").value || x.status === $("#fStatus").value));
}
function renderOv() {
  const cnt = (k) => Object.entries(ALL.reduce((a, x) => (a[x[k]] = (a[x[k]] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1]);
  const list = k => "<ul>" + cnt(k).map(([n, v]) => `<li>${esc(n)}: <b>${v}</b></li>`).join("") + "</ul>";
  $("#ov").innerHTML = `<div class="stats"><div class="stat"><b>${ALL.length}</b>Total cases</div><div class="stat"><b>${new Set(ALL.map(x => x.student_id)).size}</b>Unique students</div>
  <div class="stat"><b>${COURSES.filter(c => c.is_active).length}</b>Active courses</div><div class="stat"><b>${new Set(ALL.map(x => x.batch_id)).size}</b>Batches represented</div></div>
  <h4>By status</h4>${list("status")}<h4>By level</h4>${list("affected_level")}<h4>By semester</h4>${list("affected_semester")}<h4>Most reported courses</h4>${list("course")}`;
}
function renderCases() {
  const rows = filtered(); $("#count").textContent = `${rows.length} case(s) shown`;
  $("#caseTbl").innerHTML = `<table><tr><th>Ref</th><th>Student</th><th>Batch</th><th>Course</th><th>Level / Sem</th><th>Issue</th><th>Status</th><th></th></tr>` +
    rows.map(x => `<tr><td>${esc(x.reference_no)}</td><td>${esc(x.full_name)}<br>${esc(x.index_number)}${x.info_mismatch ? '<br><span class="flag">⚠ details differ from earlier record</span>' : ""}</td>
    <td>${esc(x.batch_label)}</td><td>${esc(x.course)}</td><td>${esc(x.affected_level)}<br>${esc(x.affected_semester)}</td>
    <td>${esc(x.category)}${x.other_explanation ? "<br><i>" + esc(x.other_explanation) + "</i>" : ""}<br><span class="hint">${esc(x.description)}</span></td>
    <td><select onchange="setStatus('${x.id}',this.value)">${STAT.map(s => `<option value="${s.id}" ${s.id === x.status_id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></td>
    <td><button class="s" onclick="addNote('${x.id}')">Note</button></td></tr>`).join("") + "</table>";
}
async function setStatus(id, sid) {
  if (!confirm("Change this case's status?")) return renderCases();
  const {error} = await sb.from("cases").update({status_id: sid}).eq("id", id); if (error) alert("Not allowed or failed: " + error.message); await loadAll();
}
async function addNote(id) {
  const body = prompt("Internal note or follow-up action:"); if (!body) return;
  const {data: u} = await sb.auth.getUser();
  const {error} = await sb.from("case_notes").insert({case_id: id, body, note_type: /follow/i.test(body) ? "follow_up" : "note", author_id: u.user.id});
  alert(error ? "Failed: " + error.message : "Note saved.");
}
function renderSetup() {
  const blk = (title, tbl, arr) => `<h4>${title}</h4><div style="display:flex;gap:8px"><input id="new_${tbl}" placeholder="Add new…"><button class="p" style="margin:0" onclick="addItem('${tbl}')">Add</button></div>
  <table style="margin-top:8px">${arr.map(x => `<tr><td>${esc(x.name)}</td><td>${x.is_active ? "Active" : "Inactive"}</td><td><button class="s" onclick="renameItem('${tbl}','${x.id}')">Rename</button>
  <button class="s" onclick="toggleItem('${tbl}','${x.id}',${!x.is_active})">${x.is_active ? "Deactivate" : "Activate"}</button></td></tr>`).join("")}</table>`;
  $("#setup").innerHTML = blk("Courses", "courses", COURSES) + blk("Issue categories", "issue_categories", CATLIST) +
    `<h4>Reset a student's password</h4><div class="row"><input id="rsid" placeholder="Student ID"><input id="rpw" type="password" placeholder="New password (8+ chars)"></div><button class="p" onclick="resetPw()">Reset password</button>` +
    `<p class="hint">Deactivating hides an item from new reports. Old reports are kept.</p>`;
}
async function addItem(t) {
  const name = $("#new_" + t).value.trim(); if (!name) return;
  if (!confirm(`Add "${name}"?`)) return; const {error} = await sb.from(t).insert({name});
  alert(error ? (error.code === "23505" ? "That name already exists." : error.message) : "Added."); await loadAll();
}
async function renameItem(t, id) {
  const name = prompt("New name:"); if (!name || !confirm(`Rename to "${name}"? Old reports will show the new name.`)) return;
  const {error} = await sb.from(t).update({name: name.trim()}).eq("id", id); if (error) alert(error.message); await loadAll();
}
async function toggleItem(t, id, v) {
  if (!confirm(v ? "Activate this item?" : "Deactivate? It will be hidden from new reports; history is kept.")) return;
  const {error} = await sb.from(t).update({is_active: v}).eq("id", id); if (error) alert(error.message); await loadAll();
}
async function resetPw() {
  const sid = $("#rsid").value, pw = $("#rpw").value; if (!sid || pw.length < 8) return alert("Enter a Student ID and a password of 8+ characters.");
  if (!confirm("Reset password for " + sid + "?")) return;
  const fd = new FormData(); fd.append("action", "reset_password"); fd.append("sid", sid); fd.append("password", pw);
  const r = await fetch(API, {method: "POST", headers: await authHeaders(), body: fd}); const j = await r.json();
  alert(r.ok ? "Password reset." : (j.error || "Failed")); if (r.ok) { $("#rsid").value = ""; $("#rpw").value = ""; }
}
// ---- reports ----
function report() {
  const rows = filtered(), mode = $("#mode").value, G = {};
  const keyOf = x => mode === "batch" ? [x.batch_label, x.course] : mode === "course" ? [x.course, x.batch_label] : [x.affected_level + " — " + x.affected_semester, x.course];
  rows.forEach(x => { const [a, b] = keyOf(x); ((G[a] = G[a] || {})[b] = G[a][b] || []).push(x); });
  const f = ["#fBatch", "#fCourse", "#fCat", "#fLevel", "#fSem", "#fStatus"].map(i => $(i).value).filter(Boolean).join(", ") || "None";
  let h = `<h2>EXAMINATION ISSUES REPORT</h2><p>Generated: ${new Date().toLocaleString()}<br>Filters: ${esc(f)}<br>Total cases: ${rows.length}</p>`;
  Object.keys(G).sort().forEach(a => { h += `<h3>${esc(a)}</h3>`;
    Object.keys(G[a]).sort().forEach(b => { h += `<h4>${esc(b)}</h4><div class="tw"><table><tr><th>Name</th><th>Index</th><th>Batch</th><th>Course</th><th>Level</th><th>Semester</th><th>Issue</th><th>Ref</th><th>Status</th></tr>` +
      G[a][b].map(x => `<tr><td>${esc(x.full_name)}</td><td>${esc(x.index_number)}</td><td>${esc(x.batch_label)}</td><td>${esc(x.course)}</td><td>${esc(x.affected_level)}</td><td>${esc(x.affected_semester)}</td><td>${esc(x.category)}</td><td>${esc(x.reference_no)}</td><td>${esc(x.status)}</td></tr>`).join("") + "</table></div>"; }); });
  $("#repOut").innerHTML = h;
}
$("#gen").onclick = report;
$("#prt").onclick = () => { report(); window.print(); };
$("#csv").onclick = () => {
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"';
  const head = ["Reference", "Name", "Index", "Batch", "Course", "Level", "Semester", "Issue", "Status", "Submitted"];
  const lines = [head.map(cell).join(",")].concat(filtered().map(x => [x.reference_no, x.full_name, x.index_number, x.batch_label, x.course, x.affected_level, x.affected_semester, x.category, x.status, x.submitted_at].map(cell).join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/csv"})); a.download = "exam-issues.csv"; a.click();
};
initStudent();
sb.auth.getSession().then(({data}) => { if (data.session) startAdmin(true); });
</script>
</body>
